name: Release extension
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: onboard-release
    cancel-in-progress: false
jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 24.15.0
                  package-manager-cache: false
            - run: npm ci --ignore-scripts
            - run: npm audit --audit-level=high
            - run: npm run lint
            - run: npm test
            - run: npm run pack:prod
            - run: python scripts/test-package.py
            - name: Generate runtime dependency inventory
              run: npx --no-install cyclonedx-npm --omit dev --output-reproducible --output-format JSON --output-file onboard-qs.sbom.cdx.json
            - name: Publish draft from this exact main commit
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_SHA: ${{ github.sha }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="onboard-qs-v$VERSION"
                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                      echo "::error::Version already tagged. Increment the version through a PR."
                      exit 1
                  fi
                  gh release create "$TAG" onboard-qs.zip SHA256SUMS onboard-qs.sbom.cdx.json \
                    --target "$RELEASE_SHA" --draft --title "Onboard Tour $VERSION" \
                    --notes-file release-config/notes.md
